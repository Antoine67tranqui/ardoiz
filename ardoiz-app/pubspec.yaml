name: ardoiz
description: >
  Carné (ex-Ardoiz) : gestion digitale du crédit informel (« l'ardoise ») pour
  les commerçants d'Afrique de l'Ouest. Application offline-first.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # État et navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Stockage local chiffré (SQLCipher, voir la section hooks plus bas)
  sqlite3: ^3.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0

  # Réseau
  dio: ^5.11.1
  connectivity_plus: ^7.3.2

  # Plateforme
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

  # Utilitaires
  intl: any
  uuid: ^4.6.0
  collection: ^1.19.1
  characters: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

# Le chiffrement de la base locale (AES-256) repose sur SQLCipher, fourni par
# le package sqlite3 via les hooks Dart. Sans cette option, la base serait en
# clair : l'app refuse alors de démarrer (voir AppDatabase.open).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: false
