name: Flutter CI

on:
  push:
    paths:
      - 'ardoiz-app/**'
      - 'ardoiz-backend/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'ardoiz-app/**'
      - 'ardoiz-backend/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ardoiz-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - name: Analyse statique (aucun avertissement toléré)
        run: flutter analyze
      - name: Tests (unitaires, widgets, base chiffrée SQLCipher)
        run: flutter test

  integration:
    # L'app (base chiffrée, synchronisation, client HTTP) contre le VRAI backend.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ardoiz:ardoiz@localhost:5432/ardoiz_it?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ardoiz
          POSTGRES_PASSWORD: ardoiz
          POSTGRES_DB: ardoiz_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ardoiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ardoiz-backend/package-lock.json
      - name: Démarrer le backend (hors production)
        working-directory: ardoiz-backend
        run: |
          npm ci
          npm run prisma:generate
          npm run build
          npx prisma migrate deploy
          PORT=3998 \
          JWT_ACCESS_SECRET=ci-access-secret-0123456789abcdef0123456789 \
          JWT_REFRESH_SECRET=ci-refresh-secret-0123456789abcdef0123456789 \
          JWT_OTP_SECRET=ci-otp-secret-0123456789abcdef0123456789abcdef \
          MOMO_WEBHOOK_SECRET=ci-webhook-secret-0123456789abcdef0123456789 \
          TRUST_PROXY=0 \
          nohup node dist/main.js > backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3998/api/v1/health && exit 0; sleep 2; done
          cat backend.log; exit 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: Test d'intégration
        working-directory: ardoiz-app
        run: |
          flutter pub get
          CARNE_BACKEND_URL=http://localhost:3998/api/v1 flutter test test/integration
