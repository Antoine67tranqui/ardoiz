services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ardoiz
      POSTGRES_PASSWORD: ardoiz
      POSTGRES_DB: ardoiz
    ports:
      - "5432:5432"
    volumes:
      - ardoiz_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ardoiz"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ardoiz:ardoiz@db:5432/ardoiz?schema=public
      # Pile de DEVELOPPEMENT uniquement (mots de passe d'exemple, base exposee) :
      # l'image est en production par defaut, ce qui exige de vrais secrets.
      # Un deploiement reel ne doit pas utiliser ce fichier tel quel.
      NODE_ENV: development
    ports:
      - "3000:3000"

volumes:
  ardoiz_db_data:
