name: ardoiz
description: >
  Ardoiz - gestion digitale du credit informel ("l'ardoise") pour les
  commercants d'Afrique de l'Ouest. Application offline-first.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Stockage local offline-first
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Reseau
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Securite / session locale
  flutter_secure_storage: ^9.2.2

  # UI / formattage
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
