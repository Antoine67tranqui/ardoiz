name: Backend CI

on:
  push:
    paths:
      - 'ardoiz-backend/**'
  pull_request:
    paths:
      - 'ardoiz-backend/**'

defaults:
  run:
    working-directory: ardoiz-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ardoiz-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
