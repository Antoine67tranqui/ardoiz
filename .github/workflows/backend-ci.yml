name: Backend CI

on:
  push:
    paths:
      - 'ardoiz-backend/**'
  pull_request:
    paths:
      - 'ardoiz-backend/**'

defaults:
  run:
    working-directory: ardoiz-backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://ardoiz:ardoiz@localhost:5432/ardoiz_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ardoiz
          POSTGRES_PASSWORD: ardoiz
          POSTGRES_DB: ardoiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ardoiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ardoiz-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Check schema drift (migrations vs schema.prisma)
        run: npx prisma migrate diff --from-url "$TEST_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: End-to-end tests
        run: npm run test:e2e
