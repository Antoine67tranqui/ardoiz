name: Web CI

on:
  push:
    paths:
      - 'ardoiz-web/**'
      - 'ardoiz-backend/src/subscription/plan.constants.ts'
  pull_request:
    paths:
      - 'ardoiz-web/**'
      - 'ardoiz-backend/src/subscription/plan.constants.ts'

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ardoiz-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
